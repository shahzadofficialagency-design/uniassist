services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uniassist
      POSTGRES_PASSWORD: uniassist
      POSTGRES_DB: uniassist
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://uniassist:uniassist@db:5432/uniassist
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
