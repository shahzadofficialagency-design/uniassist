# Render — backend (FastAPI). Render reads this file automatically when the
# repo is connected ("Blueprint"). Free tier: the SQLite database re-seeds on
# every restart, so demo users/chats reset — fine for a demo deployment.
services:
  - type: web
    name: uniassist-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./uniassist.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: none
